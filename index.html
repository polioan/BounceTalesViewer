    <style>
      :root {
        color-scheme: dark;
        --bg: #111;
        --card: #1c1c1c;
        --text: #f2f2f2;
        --muted: #9a9a9a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.4 system-ui,
          sans-serif;
      }

      main {
        max-width: 52rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      h1,
      h2 {
        margin: 0;
        text-align: center;
      }

      h1 {
        margin-bottom: 1.5rem;
        font-size: 1.75rem;
        font-weight: 650;
      }

      section + section {
        margin-top: 1.25rem;
      }

      h2 {
        margin-bottom: 0.5rem;
        font-size: 0.8rem;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      ul {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.6rem 0.35rem;
        background: var(--card);
        color: var(--text);
        text-align: center;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #2a2a2a;
      }
    </style>
